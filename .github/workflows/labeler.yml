name: Labeler
on:
  pull_request:
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7: Input required for manual trigger
      pr-number:
        description: 'The pull request number(s)'
        required: true

permissions: {}

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: srz-zumix/labeler-action@850b114f641f00a443731e54ca269c12a18112ce # v0.11.0
        with:
          pr-number: ${{ github.event.inputs.pr-number || github.event.number }}
