name: Publish
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      - run: bundle install
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

  docker-build:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build.yml
    with:
      publish: true
    secrets: inherit
